# Publishes the Linux binaries for a `v*` tag and CREATES the GitHub Release
# that carries them.
#
# `install.sh` (Orderly, S13) fetches exactly these asset names from
# https://github.com/xyzhub/orderly-print-bridge/releases/download/<tag>/<name>,
# and so does `orderly-print-bridge self-update`. THE NAMES ARE A CROSS-REPO
# CONTRACT (P-12): renaming one here is a 404 there that reads like a network
# failure on a client's counter.
#
#   orderly-print-bridge-linux-amd64
#   orderly-print-bridge-linux-arm64
#   orderly-print-bridge_<tag>_linux_amd64.tar.gz
#   orderly-print-bridge_<tag>_linux_arm64.tar.gz
#   SHA256SUMS                       (covers all four)
#
# The bare binaries are what the installer and the self-updater use — an
# installer that has to untar is an installer with one more way to fail. The
# tarballs ship beside them for anyone who wants the README with the binary.
#
# The tag is created by a human, never by this workflow: shipping a new binary
# to every client's counter is a decision, not a side effect of a merge.
#
# There is NO container image job (LD-33). The v1.0.0 package stays published —
# the LXC's rollback is `systemctl start orderly-bridge` on the cached image —
# but the install path is now the binary + systemd unit, and building an image
# nothing installs is a build that only rots.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # the release job CREATES the release and uploads its assets

jobs:
  # The gate runs ONCE, natively, before anything is published. This job is what
  # makes a green tag mean the same thing for arm64 (the t640 and the Pi) as for
  # amd64.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - run: go vet ./...
      - run: go test ./... -count=1
      - name: cross-compile every target the box or a PC can be
        run: |
          set -e
          for target in linux/amd64 linux/arm64 linux/arm windows/amd64 darwin/arm64 darwin/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null .
            echo "ok $target"
          done

  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false

      # CGO_ENABLED=0 so one binary runs on Debian, Alpine and a Pi without a
      # matching libc; -trimpath so the build is reproducible and no builder
      # path is baked in; -X stamps the tag into the version the daemon reports
      # on every heartbeat and compares against when self-updating.
      - name: build linux/amd64 + linux/arm64
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${TAG#v}"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X github.com/xyz/orderly-print-bridge/internal/version.Version=${VERSION}" \
              -o "dist/orderly-print-bridge-linux-${arch}" .
          done

      - name: verify the stamped version
        run: |
          set -euo pipefail
          # amd64 runs natively on the runner: a binary that reports the wrong
          # version is a binary whose -X silently missed (a const, a renamed
          # package), and that is invisible until a venue reports the wrong
          # build months later.
          got="$(./dist/orderly-print-bridge-linux-amd64 version)"
          echo "$got"
          case "$got" in
            *"${GITHUB_REF_NAME#v}") echo "version stamp ok" ;;
            *) echo "::error::binary reports '$got', expected the tag ${GITHUB_REF_NAME}"; exit 1 ;;
          esac

      - name: package the tarballs
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp README.md dist/README.md
          cd dist
          for arch in amd64 arm64; do
            cp "orderly-print-bridge-linux-${arch}" orderly-print-bridge
            tar -czf "orderly-print-bridge_${TAG}_linux_${arch}.tar.gz" orderly-print-bridge README.md
            rm orderly-print-bridge
          done
          rm README.md

      # ONE SHA256SUMS over every asset — it is what `self-update` verifies
      # against before it renames a downloaded binary into place, and what a
      # stranger runs `sha256sum -c` on.
      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum orderly-print-bridge-linux-* orderly-print-bridge_*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: create the release and upload the assets
        uses: softprops/action-gh-release@v2
        with:
          # No release exists for a tag until this runs — v1.0.0 has none, which
          # is why install.sh could not have fetched anything.
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/orderly-print-bridge-linux-amd64
            dist/orderly-print-bridge-linux-arm64
            dist/orderly-print-bridge_*_linux_amd64.tar.gz
            dist/orderly-print-bridge_*_linux_arm64.tar.gz
            dist/SHA256SUMS

      - name: what shipped
        run: |
          {
            echo "### Published ${GITHUB_REF_NAME}"
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo "Install: \`curl -fsSL https://<your-orderly>/install.sh | sudo bash -s -- --code ABCDEFGHJK\`"
          } >> "$GITHUB_STEP_SUMMARY"
